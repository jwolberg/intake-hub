# Repo-level dev tooling config (lint + test). Runtime deps live in
# backend/requirements.txt.

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# UP042 (str+Enum -> StrEnum) changes str() of members; not a mechanical fix.
ignore = ["UP042"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
