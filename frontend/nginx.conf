# Serve the SPA on Cloud Run's default container port (8080). Unknown paths fall
# back to index.html so client-side routing works.
#
# Security headers (#0014). The CSP assumes the production topology: the API is
# on this same origin behind the IAP load balancer (connect-src 'self'), and the
# only third party is Google Fonts (index.html). A split-origin build
# (VITE_API_URL=<other origin>) must add that origin to connect-src/img-src.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location / {
    try_files $uri $uri/ /index.html;
  }
}
